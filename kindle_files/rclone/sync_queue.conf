# Reading queue configuration for sync_queue.sh
# Copy this file to /mnt/us/rclone/sync_queue.conf and adjust as needed.

# rclone remote name as defined in rclone.conf
REMOTE="nc_calibre_news"

# Queue folder on the Nextcloud server (relative to the remote root,
# i.e. relative to .../remote.php/dav/files/<user>/).
# Same location calibre-web uploads its books to.
QUEUE="Books Library/calibre/books/downloads/sync"

# Local destination folders
NEWS_DIR="/mnt/us/documents/News"
BOOKS_DIR="/mnt/us/documents/Books"
